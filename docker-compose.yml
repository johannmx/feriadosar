# Development: builds from source
services:
  api:
    build: ./web/api
    container_name: feriadosar-api-dev
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=development
    restart: always

  client:
    build: ./web/client
    container_name: feriadosar-client-dev
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: always
